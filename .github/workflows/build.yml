name: Build Mac & Linux

on:
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Generate integrity manifest
        run: node build-scripts/generate-integrity.js

      - name: Build macOS
        run: npx electron-builder --mac --publish never

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VersePC-mac-${{ github.run_id }}
          path: |
            dist/*.dmg
            dist/*-mac.zip
          if-no-files-found: warn

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 libsnappy-dev

      - name: Install dependencies
        run: npm install

      - name: Generate integrity manifest
        run: node build-scripts/generate-integrity.js

      - name: Build Linux
        run: npx electron-builder --linux --publish never

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VersePC-linux-${{ github.run_id }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.snap
          if-no-files-found: warn

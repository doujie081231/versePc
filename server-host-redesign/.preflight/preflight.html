<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preflight</title>
    <style id="theme-vars">
/* VersePC 设计系统 - 本地开服页面画布预览 */

:root {
  /* 品牌语义别名（Tailwind @theme 映射用） */
  --verse-background: #0a0a0a;
  --verse-foreground: #f0f0f0;
  --verse-card: #181818;
  --verse-card-foreground: #f0f0f0;
  --verse-popover: #1c1c1c;
  --verse-popover-foreground: #f0f0f0;
  --verse-primary: #ffffff;
  --verse-primary-foreground: #0a0a0a;
  --verse-muted: #242424;
  --verse-muted-foreground: #a0a0a0;
  --verse-border: rgba(255, 255, 255, 0.08);
  --verse-input: #1c1c1c;
  --verse-ring: rgba(255, 255, 255, 0.15);
  --verse-radius-sm: 4px;
  --verse-radius-md: 8px;
  --verse-radius-lg: 12px;

  /* 状态色（仅用于状态标签/徽章/反馈） */
  --verse-state-success: #4caf50;
  --verse-state-warning: #ff9800;
  --verse-state-error: #ef5350;
  --verse-state-info: #3b82f6;

  /* 兼容原应用的命名变量 */
  --bg-primary: var(--verse-background);
  --bg-secondary: #141414;
  --bg-tertiary: #1c1c1c;
  --bg-card: var(--verse-card);
  --bg-hover: #242424;
  --bg-active: #2e2e2e;
  --bg-glass: rgba(10, 10, 10, 0.85);
  --bg-card-glass: rgba(24, 24, 24, 0.7);
  --text-primary: var(--verse-foreground);
  --text-secondary: #a0a0a0;
  --text-muted: #666666;
  --accent: var(--verse-primary);
  --accent-hover: #d0d0d0;
  --accent-glow: var(--verse-ring);
  --accent-text: var(--verse-primary-foreground);
  --accent-rgb: 255, 255, 255;
  --green: var(--verse-state-success);
  --green-glow: rgba(76, 175, 80, 0.3);
  --red: var(--verse-state-error);
  --red-glow: rgba(239, 83, 80, 0.3);
  --orange: var(--verse-state-warning);
  --yellow: #ffc107;
  --purple: #ab47bc;
  --border: var(--verse-border);
  --hover-overlay: rgba(255, 255, 255, 0.06);
  --dot-border: rgba(255, 255, 255, 0.2);
  --shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
  --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.6);
  --radius: var(--verse-radius-md);
  --radius-lg: var(--verse-radius-lg);
  --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
}

html.light {
  --verse-background: #ffffff;
  --verse-foreground: #1a1a1a;
  --verse-card: #fafafa;
  --verse-card-foreground: #1a1a1a;
  --verse-popover: #f5f5f7;
  --verse-popover-foreground: #1a1a1a;
  --verse-primary: #1a1a1a;
  --verse-primary-foreground: #ffffff;
  --verse-muted: #e8e8ed;
  --verse-muted-foreground: #4a4a4a;
  --verse-border: rgba(0, 0, 0, 0.1);
  --verse-input: #eeeef0;
  --verse-ring: rgba(0, 0, 0, 0.1);
  --verse-state-success: #16a34a;
  --verse-state-error: #dc2626;
  --verse-state-warning: #ea580c;
  --verse-state-info: #2563eb;

  --bg-primary: var(--verse-background);
  --bg-secondary: #f5f5f7;
  --bg-tertiary: #eeeef0;
  --bg-card: var(--verse-card);
  --bg-hover: #e8e8ed;
  --bg-active: #dddde5;
  --bg-glass: rgba(245, 245, 247, 0.85);
  --bg-card-glass: rgba(250, 250, 250, 0.7);
  --text-primary: var(--verse-foreground);
  --text-secondary: #4a4a4a;
  --text-muted: #8a8a8a;
  --accent: var(--verse-primary);
  --accent-hover: #333333;
  --accent-glow: var(--verse-ring);
  --accent-text: var(--verse-primary-foreground);
  --accent-rgb: 26, 26, 26;
  --green: var(--verse-state-success);
  --red: var(--verse-state-error);
  --orange: var(--verse-state-warning);
  --purple: #7c3aed;
  --border: var(--verse-border);
  --hover-overlay: rgba(0, 0, 0, 0.06);
  --dot-border: rgba(0, 0, 0, 0.15);
  --shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
  --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.08);
}

    </style>

    <style type="text/tailwindcss">

  @layer base {
    body { background: var(--verse-background); color: var(--verse-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
